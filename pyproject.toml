[project]
name = "sfa-extractor"
version = "0.1.0"
description = "Extract 5.1 surround AC3 mixes from DVD-Video album releases, split into per-track files"
requires-python = ">=3.13"
dependencies = [
    "mutagen>=1.48.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
